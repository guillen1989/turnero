<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>{{ _('Sin conexión') }} · {{ _('Turnero') }}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #1f2937;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .offline-card { max-width: 24rem; }
    h1 { color: #2563eb; margin-bottom: 0.5rem; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      background: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>{{ _('Sin conexión') }}</h1>
    <p>{{ _('No se ha podido conectar con Turnero. Comprueba tu conexión a internet e inténtalo de nuevo.') }}</p>
    <button onclick="location.reload()">{{ _('Reintentar') }}</button>
  </div>
</body>
</html>
